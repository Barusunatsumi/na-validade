<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Na Validade</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1FAF6;--sf:#fff;--ink:#0F2A24;--mut:#587068;--ln:#D5E8E0;--pri:#0FA968;--pri2:#13C9A2;--ac:#FF8F1F;--pl:#3A1F5C;--gold:#FFC93C;--red:#E5384F;--yel:#D99A00;--grn:#0FA968;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1C19;--sf:#14302B;--ink:#E8F6F0;--mut:#8FB0A6;--ln:#24443D;--pri:#2FD08C}}
:root[data-theme="dark"]{--bg:#0C1C19;--sf:#14302B;--ink:#E8F6F0;--mut:#8FB0A6;--ln:#24443D;--pri:#2FD08C}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Nunito,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
h1,h2,.big,.d b{font-family:'Baloo 2',Nunito,system-ui,sans-serif}
.hero{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;padding:18px 18px 26px;border-radius:0 0 30px 30px}
.hero .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hero h1{margin:0;font-size:26px;font-weight:800}
.hero p{margin:2px 0 0;opacity:.92}
.ib{border:0;background:rgba(255,255,255,.22);color:#fff;border-radius:12px;width:40px;height:40px;font-size:18px;cursor:pointer;transition:transform .15s}
.ib:active{transform:scale(.88)}
.logo{display:inline-block;font-size:34px;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(10deg)}}
main{max-width:560px;margin:0 auto;padding:14px 14px 110px}
#view>div{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(12px)}}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:14px;margin-bottom:10px}
.card h2{margin:0 0 4px;font-size:20px}.card p{margin:4px 0;color:var(--mut)}
.add input,.add select,.auth input{width:100%;padding:12px;border:2px solid var(--ln);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;margin-bottom:8px;transition:border-color .2s}
.add input:focus,.add select:focus,.auth input:focus{border-color:var(--pri);outline:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:2px}
.chips button{flex:none;border:1px solid var(--ln);background:var(--bg);color:var(--ink);border-radius:20px;padding:6px 12px;font:inherit;cursor:pointer;transition:transform .15s}
.chips button:active{transform:scale(.9)}
.btn{width:100%;padding:13px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--ac),#FF6B2C);color:#fff;font:800 17px 'Baloo 2',sans-serif;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.15);transition:transform .12s,box-shadow .12s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.15)}
.btn.pl{background:linear-gradient(135deg,var(--gold),#FFB300);color:#2B1A00}
.btn.gh{background:transparent;border:2px solid var(--ln);color:var(--ink);box-shadow:none}
.item{display:flex;gap:10px;align-items:center;background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:10px;margin-bottom:8px;animation:pop .45s cubic-bezier(.2,1.4,.4,1) backwards}
.still .item{animation:none}.still .item.new{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.8) translateY(14px);opacity:0}}
.item.out{animation:out .3s forwards}
@keyframes out{to{transform:translateX(70px) scale(.9);opacity:0}}
.em{font-size:30px}
.d{min-width:58px;text-align:center;border-radius:14px;padding:4px;color:#fff}
.d b{display:block;font-size:26px;line-height:1.1}.d small{font-size:11px}
.u .d{animation:pulse 1.3s infinite}
@keyframes pulse{50%{transform:scale(1.08);box-shadow:0 0 0 6px rgba(229,56,79,.18)}}
.nm{flex:1;min-width:0}.nm strong{display:block;overflow-wrap:anywhere}.nm span{color:var(--mut);font-size:13px}
.acts{display:flex;flex-direction:column;gap:4px}
.acts button{border:1px solid var(--ln);background:transparent;color:var(--ink);border-radius:10px;padding:5px 9px;font:inherit;font-size:13px;cursor:pointer}
.acts .ok{background:var(--pri);border-color:var(--pri);color:#fff}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.tag{display:inline-block;background:var(--bg);border:1px solid var(--ln);border-radius:20px;padding:2px 9px;font-size:12px;margin:2px 3px 0 0}
.tag.m{background:var(--pri);border-color:var(--pri);color:#fff}
.lock{border:2px dashed var(--ac);text-align:center;padding:20px 14px}
ul.pp{text-align:left;margin:10px auto;padding-left:20px;max-width:340px;color:var(--mut)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.stats .card{margin:0;text-align:center}.big{font-size:34px;font-weight:800;line-height:1.1}
.ring{width:130px;height:130px;border-radius:50%;background:conic-gradient(var(--pri) calc(var(--p)*1%),var(--ln) 0);display:grid;place-items:center;margin:6px auto}
.ring i{width:98px;height:98px;border-radius:50%;background:var(--sf);display:grid;place-items:center;font:800 28px 'Baloo 2',sans-serif;font-style:normal}
.blur{filter:blur(6px);user-select:none}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:var(--sf);border-top:1px solid var(--ln)}
nav div{display:flex;gap:6px;width:100%;max-width:560px}
nav button{flex:1;border:0;background:transparent;color:var(--mut);border-radius:14px;padding:6px 2px;font:inherit;font-size:12px;cursor:pointer;transition:background .25s,color .25s,transform .15s}
nav button span{display:block;font-size:22px}
nav button.on{background:var(--pri);color:#fff;transform:translateY(-3px)}
.auth{max-width:420px;margin:0 auto;padding:40px 22px;text-align:center}
.auth h1{font-size:34px;margin:6px 0}.auth p{color:var(--mut)}
.err{color:var(--red);min-height:22px;font-size:14px}
.ov{position:fixed;inset:0;background:rgba(10,20,18,.6);display:flex;align-items:flex-end;justify-content:center;z-index:9;animation:fade .25s}
.sheet{background:var(--sf);width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));text-align:center;animation:up .35s cubic-bezier(.2,1.2,.4,1)}
@keyframes up{from{transform:translateY(100%)}}
.price{font:800 38px 'Baloo 2',sans-serif;color:var(--pl)}
@media(prefers-color-scheme:dark){.price{color:var(--gold)}}
.p{position:fixed;pointer-events:none;font-size:22px;z-index:20;animation:fly .9s ease-out forwards}
@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
.note{font-size:12px;color:var(--mut);text-align:center;margin-top:12px}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="theme-color" content="#0FA968"></head>
<body>
<div id="app"></div>
<script>
var S={user:null,on:false,items:[],used:0,wasted:0,saved:0,lost:0,plus:false,snd:true},tab='home',ac,FREE=10,lastId=0,still=false,PRICE='R$ 4,99';
try{var r=localStorage.getItem('nv2');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
function sv(){try{localStorage.setItem('nv2',JSON.stringify(S))}catch(e){}}
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim()}
function days(e){var t=new Date();t.setHours(0,0,0,0);return Math.round((new Date(e+'T00:00:00')-t)/864e5)}
function plusDays(n){var d=new Date();d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function brl(n){return 'R$ '+n.toFixed(2).replace('.',',')}
function snd(t){if(!S.snd)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();var q={tap:[[660,.05]],add:[[520,.07],[780,.1]],ok:[[523,.08],[659,.08],[784,.15]],bad:[[300,.12],[210,.2]],plus:[[523,.08],[659,.08],[784,.08],[1047,.25]]}[t],tm=ac.currentTime;q.forEach(function(n){var o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=n[0];g.gain.setValueAtTime(.13,tm);g.gain.exponentialRampToValueAtTime(.001,tm+n[1]);o.connect(g);g.connect(ac.destination);o.start(tm);o.stop(tm+n[1]);tm+=n[1]*.9})}catch(e){}if(navigator.vibrate)try{navigator.vibrate(t==='tap'?8:25)}catch(e){}}
function burst(el,em){var b=el.getBoundingClientRect();for(var i=0;i<12;i++){var s=document.createElement('span');s.className='p';s.textContent=em[i%em.length];s.style.left=(b.left+b.width/2)+'px';s.style.top=(b.top+b.height/2)+'px';s.style.setProperty('--x',(Math.random()*180-90)+'px');s.style.setProperty('--y',(-30-Math.random()*130)+'px');s.style.setProperty('--r',(Math.random()*360-180)+'deg');document.body.appendChild(s);setTimeout(function(){s.remove()},950)}}
function count(el,to,money){if(!el)return;var t0=performance.now();(function f(t){var k=Math.min(1,(t-t0)/700),v=to*(1-Math.pow(1-k,3));el.textContent=money?brl(v):Math.round(v);if(k<1)requestAnimationFrame(f)})(t0)}
async function hs(s){try{var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')}catch(e){return btoa(unescape(encodeURIComponent(s)))}}
var EM={ovo:'🥚',leite:'🥛',tomate:'🍅',banana:'🍌',maca:'🍎',pao:'🍞',queijo:'🧀',carne:'🥩',frango:'🍗',alface:'🥬',cenoura:'🥕',batata:'🥔',iogurte:'🥣',arroz:'🍚',morango:'🍓',laranja:'🍊',uva:'🍇',peixe:'🐟',presunto:'🥓'};
function emo(n){n=norm(n);for(var k in EM)if(n.indexOf(k)>-1)return EM[k];return '🍽️'}
var R=[
{n:'Omelete recheado',e:'🍳',i:['ovo','queijo','tomate','presunto','cebola'],t:'Bata os ovos, junte o que sobrou picado e frite em fogo baixo.'},
{n:'Arroz de forno',e:'🍚',i:['arroz','queijo','presunto','tomate'],t:'Misture arroz pronto, presunto e tomate, cubra com queijo e gratine.'},
{n:'Vitamina de frutas',e:'🥤',i:['banana','leite','morango','mamao','iogurte'],t:'Bata a fruta madura com leite ou iogurte e gelo.'},
{n:'Bolo de banana',e:'🍰',i:['banana','ovo','farinha','leite'],t:'Bananas passadas viram bolo: misture com ovos e farinha e asse.'},
{n:'Sopa de legumes',e:'🍲',i:['cenoura','batata','abobrinha','chuchu','cebola'],t:'Cozinhe os legumes com alho e cebola e bata ou deixe em pedaços.'},
{n:'Rabanada',e:'🍞',i:['pao','ovo','leite'],t:'Pão amanhecido molhado em leite e ovo, frito e passado no açúcar.'},
{n:'Molho de tomate caseiro',e:'🍅',i:['tomate','cebola','alho'],t:'Refogue tudo e cozinhe até desmanchar. Congela bem.'},
{n:'Salada de frutas',e:'🍓',i:['maca','banana','laranja','mamao','uva','morango'],t:'Corte tudo, junte suco de laranja e sirva gelada.'}];
var Q=[['Leite',5],['Ovo',21],['Tomate',6],['Banana',4],['Pão',4],['Frango',2],['Queijo',10],['Alface',5]];
function auth(){
var has=!!S.user;
$('app').innerHTML='<div class="auth"><div class="logo">🥬</div><h1>Na Validade</h1><p>'+(has?'Que bom te ver de novo, '+esc(S.user.name)+'!':'Crie sua conta e pare de jogar comida fora.')+'</p>'+(has?'':'<input id="an" placeholder="Seu nome" autocomplete="name">')+'<input id="ae" type="email" placeholder="E-mail" autocomplete="email" value="'+(has?esc(S.user.email):'')+'"><input id="ap" type="password" placeholder="Senha (mínimo 4 caracteres)" autocomplete="'+(has?'current-password':'new-password')+'"><div class="err" id="er"></div><button class="btn" onclick="login()">'+(has?'Entrar':'Criar conta')+'</button><p class="note">Sua conta e seus dados ficam só neste aparelho.</p></div>'}
async function login(){
var e=$('ae').value.trim().toLowerCase(),p=$('ap').value,n=$('an')?$('an').value.trim():'';
if(!/^\S+@\S+\.\S+$/.test(e))return $('er').textContent='Digite um e-mail válido.';
if(p.length<4)return $('er').textContent='A senha precisa de pelo menos 4 caracteres.';
var h=await hs(e+':'+p);
if(S.user){if(S.user.email!==e||S.user.h!==h)return $('er').textContent='E-mail ou senha incorretos.'}
else{if(!n)return $('er').textContent='Digite seu nome.';S.user={name:n,email:e,h:h}}
S.on=true;sv();snd('plus');still=false;render()}
function logout(){S.on=false;sv();render()}
function setTab(t){snd('tap');tab=t;still=false;render()}
function color(d){return d<0?'var(--red)':d<=2?'var(--ac)':d<=5?'var(--yel)':'var(--grn)'}
function quick(n,d){$('n').value=n;$('e').value=plusDays(d);snd('tap')}
function add(){
var n=$('n').value.trim(),e=$('e').value,p=parseFloat(($('p').value||'0').replace(',','.'))||0;
if(!n||!e){$('n').focus();return alert('Digite o nome e a data de validade.')}
if(!S.plus&&S.items.length>=FREE)return pay('Você chegou a '+FREE+' itens no plano grátis.');
lastId=Date.now();S.items.push({id:lastId,n:n,e:e,p:p,l:$('l').value});sv();snd('add');still=true;render()}
function done(id,ok,b){
var i=S.items.find(function(x){return x.id===id});if(!i)return;
if(ok){S.used++;S.saved+=i.p;burst(b,['🎉','✨','💚','⭐'])}else{S.wasted++;S.lost+=i.p}
snd(ok?'ok':'bad');b.closest('.item').classList.add('out');
setTimeout(function(){S.items=S.items.filter(function(x){return x.id!==id});sv();still=true;render()},300)}
function pay(m){
var o=document.createElement('div');o.className='ov';o.id='ov';o.onclick=function(ev){if(ev.target===o)o.remove()};
o.innerHTML='<div class="sheet"><div class="logo">⭐</div><h2 style="margin:4px 0">Na Validade Plus</h2><p style="color:var(--mut);margin:0">'+(m||'Aproveite mais, desperdice menos.')+'</p><ul class="pp"><li>Itens ilimitados na geladeira</li><li>Receitas com o que vai vencer</li><li>Quanto dinheiro você economizou</li></ul><div class="price">'+PRICE+'<small style="font-size:16px">/mês</small></div><button class="btn pl" onclick="plus(true)">Experimentar Plus (demo)</button><button class="btn gh" style="margin-top:8px" onclick="$(\'ov\').remove()">Agora não</button></div>';
document.body.appendChild(o);snd('tap')}
function plus(on){S.plus=on;sv();var o=$('ov');if(o)o.remove();if(on){snd('plus');burst(document.body,['⭐','✨','🎉'])}still=false;render()}
function home(){
var h='<div class="card add"><div class="chips">'+Q.map(function(q){return '<button onclick="quick(\''+q[0]+'\','+q[1]+')">'+emo(q[0])+' '+q[0]+'</button>'}).join('')+'</div><input id="n" placeholder="Alimento (ex.: tomate)" aria-label="Alimento"><div class="g2"><input id="e" type="date" value="'+plusDays(3)+'" aria-label="Validade"><select id="l" aria-label="Onde guardou"><option>Geladeira</option><option>Freezer</option><option>Despensa</option></select></div><input id="p" inputmode="decimal" placeholder="Preço R$ (opcional)" aria-label="Preço"><button class="btn" onclick="add()">Adicionar</button></div>';
var l=S.items.slice().sort(function(a,b){return a.e<b.e?-1:1});
if(!S.plus)h+='<p class="note" style="margin:0 0 8px">'+S.items.length+' de '+FREE+' itens no plano grátis</p>';
if(!l.length)return h+'<div class="empty">Nada por aqui ainda. Toque num alimento acima para começar.</div>';
l.forEach(function(i,k){var d=days(i.e);
h+='<div class="item'+(d<=2?' u':'')+(i.id===lastId?' new':'')+'" style="animation-delay:'+k*50+'ms"><div class="em">'+emo(i.n)+'</div><div class="d" style="background:'+color(d)+'"><b>'+(d<0?'!':d)+'</b><small>'+(d<0?'venceu':d===1?'dia':'dias')+'</small></div><div class="nm"><strong>'+esc(i.n)+'</strong><span>'+(d<0?'Venceu há '+(-d)+' dia(s)':d===0?'Vence hoje':'Vence em '+d+' dia(s)')+' · '+esc(i.l||'Geladeira')+(i.p?' · '+brl(i.p):'')+'</span></div><div class="acts"><button class="ok" onclick="done('+i.id+',true,this)">Usei</button><button onclick="done('+i.id+',false,this)">Joguei fora</button></div></div>'});
return h}
function lock(t,a){return '<div class="card lock"><h2>'+t+'</h2><ul class="pp">'+a.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul><button class="btn pl" onclick="pay()">Conhecer o Plus · '+PRICE+'/mês</button></div>'}
function recipes(){
if(!S.plus)return lock('Receitas com o que vai vencer',['Sugestões usando só o que vence em até 5 dias','Passo a passo curto para cada receita','Ideias para congelar e aproveitar mais']);
var soon=S.items.filter(function(i){return days(i.e)<=5}).map(function(i){return norm(i.n)});
if(!soon.length)return '<div class="empty">Nada vencendo nos próximos 5 dias. Quando tiver, as receitas aparecem aqui.</div>';
var h='';
R.forEach(function(r){var m=r.i.filter(function(g){return soon.some(function(s){return s.indexOf(g)>-1||g.indexOf(s)>-1})});
if(m.length)h+='<div class="card"><h2>'+r.e+' '+r.n+'</h2><p>'+r.t+'</p>'+m.map(function(x){return '<span class="tag m">'+x+'</span>'}).join('')+r.i.filter(function(x){return m.indexOf(x)<0}).map(function(x){return '<span class="tag">'+x+'</span>'}).join('')+'</div>'});
return h||'<div class="empty">Ainda não tenho receita para esses itens. Tente ovo, banana, tomate ou legumes.</div>'}
function stats(){
var t=S.used+S.wasted,pc=t?Math.round(S.used/t*100):0;
var h='<div class="stats"><div class="card"><div class="big" id="c1">0</div>aproveitados 💚</div><div class="card"><div class="big" id="c2">0</div>jogados fora</div></div>';
setTimeout(function(){count($('c1'),S.used);count($('c2'),S.wasted);count($('c3'),S.saved,1);count($('c4'),S.lost,1)},60);
if(!S.plus)return h+'<div class="card"><div class="blur"><div class="big">R$ 000,00</div>economizados</div></div>'+lock('Veja quanto dinheiro você salvou',['Valor economizado e desperdiçado','Taxa de aproveitamento do seu mês']);
return h+'<div class="stats"><div class="card"><div class="big" id="c3" style="color:var(--grn)">0</div>economizados</div><div class="card"><div class="big" id="c4" style="color:var(--red)">0</div>desperdiçados</div></div><div class="card"><div class="ring" style="--p:'+pc+'"><i>'+pc+'%</i></div>de aproveitamento</div><button class="btn gh" onclick="plus(false)">Voltar ao plano grátis (demo)</button>'}
function render(){
if(!S.on||!S.user)return auth();
var soon=S.items.filter(function(i){return days(i.e)<=2}).length,T=[['home','🧊','Geladeira'],['rec','🍳','Receitas'],['st','📊','Economia']];
$('app').className=still?'still':'';
$('app').innerHTML='<div class="hero"><div class="row"><div><h1>Olá, '+esc(S.user.name.split(' ')[0])+' 👋</h1><p>'+(soon?soon+' item(ns) pedem atenção hoje':'Tudo sob controle por aqui')+(S.plus?' · Plus ⭐':'')+'</p></div><div><button class="ib" aria-label="Som" onclick="S.snd=!S.snd;sv();snd(\'tap\');render()">'+(S.snd?'🔊':'🔇')+'</button> <button class="ib" aria-label="Sair" onclick="logout()">⎋</button></div></div></div><main><div id="view"><div>'+(tab==='home'?home():tab==='rec'?recipes():stats())+'</div></div><p class="note">Plus em modo demonstração: nenhuma cobrança é feita.</p></main><nav><div>'+T.map(function(t){return '<button class="'+(tab===t[0]?'on':'')+'" onclick="setTab(\''+t[0]+'\')"><span>'+t[1]+'</span>'+t[2]+'</button>'}).join('')+'</div></nav>'}
render();
</script>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){})</script></body>
</html>
